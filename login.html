<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central do Assinante - Mixx Internet</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .login-box h2 { color: #333; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #004494; }
        #mensagem { color: red; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Mixx Internet</h2>
    <form id="loginForm">
        <input type="text" id="cpf" placeholder="Digite seu CPF" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
    </form>
    <p id="mensagem"></p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Impede a página de recarregar
        
        const cpf = document.getElementById('cpf').value;
        const senha = document.getElementById('senha').value;
        const mensagemErro = document.getElementById('mensagem');
        
        // O FastAPI OAuth2 exige que os dados sejam enviados como formulário (URLSearchParams)
        const dadosFormulario = new URLSearchParams();
        dadosFormulario.append('username', cpf);
        dadosFormulario.append('password', senha);

        try {
            const resposta = await fetch('https://site-mixx.onrender.com/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: dadosFormulario
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                // Guarda o token criptografado na memória do navegador
                localStorage.setItem('mixx_token', dados.access_token);
                mensagemErro.style.color = "green";
                mensagemErro.innerText = "Login efetuado com sucesso! Redirecionando...";
                
                // Redireciona para o painel em 2 segundos
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            } else {
                mensagemErro.innerText = dados.detail || "Erro ao fazer login.";
            }
        } catch (error) {
            mensagemErro.innerText = "Erro ao conectar com o servidor.";
        }
    });
</script>

</body>
</html>
